<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>→ Exercice 5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, sans-serif;
        }
        .msg { text-align: center; color: #333; }
        .msg h2 { font-size: 2rem; margin-bottom: 0.5rem; }
        .msg p { font-size: 1rem; color: #888; }
        .dot-loader { display: flex; gap: 8px; justify-content: center; margin-top: 1.5rem; }
        .dot-loader span { width: 10px; height: 10px; background: #333; border-radius: 50%; animation: bounce 0.8s infinite alternate; }
        .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
        .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { from { opacity: 0.3; transform: translateY(0); } to { opacity: 1; transform: translateY(-8px); } }
    </style>
    <script>
        sessionStorage.setItem('startExercice', '5');
        window.location.replace('https://sarx613.github.io/SAR-Exam/');
    </script>
</head>
<body>
    <div class="msg">
        <h2>Exercice 5</h2>
        <p>Redirection en cours…</p>
        <div class="dot-loader"><span></span><span></span><span></span></div>
    </div>
</body>
</html>
